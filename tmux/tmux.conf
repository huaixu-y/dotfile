unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-shell /usr/bin/nu

set -g mouse on              # 鼠标支持（滚轮、拖拽分屏）
set -g base-index 1          # 窗口编号从 1 开始（0 离左手太远）
setw -g pane-base-index 1    # 面板编号也从 1 开始

setw -g mode-keys vi         # 启用 Vi 键位
# vim 风格的选择
bind -T copy-mode-vi v   send -X begin-selection
# bind -T copy-mode-vi V   send -X select-line
# bind -T copy-mode-vi C-v send -X rectangle-toggle

# 复制到系统剪贴板
# macOS:
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
# Linux:
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard'

# 只在复制模式/查看模式显示滚动条（推荐）
# set -g pane-scrollbars modal
# set -g pane-scrollbars-position right
# set -g pane-scrollbars-style fg=colour248,bg=colour236

bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# C-a C-p 开一个居中的悬浮终端，退出自动关
bind C-p display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 80% -E "nu"

# C-a M 开悬浮 btop（系统监控）
bind M display-popup -w 80% -h 80% -E "btop"

# C-a m 开悬浮的 popup 会话（可以保留状态，下次再开还在）
bind m display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 80% -E "tmux new-session -A -s popup"

# C-a g 开悬浮 lazygit（在 popup 里跑，退出自动关）
bind g display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 80% -E "lazygit"

# C-a h 开悬浮 helix（在当前目录 popup 打开，退出自动关）
bind h display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 80% -E "hx"

bind / display-menu -T "Command" -xC -yC \
    "btop"    b "display-popup -E -w 80% -h 80% btop" \
    "lazygit" g "display-popup -E -d '#{pane_current_path}' -w 80% -h 80% lazygit" \
    "helix"   h "display-popup -E -d '#{pane_current_path}' -w 80% -h 80% hx" \
    "close"   q ""
